[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "unikegg"
version = "0.1.0"
description = "Swiss-Prot and KEGG relational data integration"
requires-python = ">=3.11"
dependencies = ["mysql-connector-python==9.4.0"]

[project.scripts]
unikegg = "unikegg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unikegg = ["schema.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
