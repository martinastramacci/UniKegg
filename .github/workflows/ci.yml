name: Validate UniKegg

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip install --no-deps -e .
      - run: ruff check src tests tools
      - run: sqlfluff lint db --dialect mysql
      - run: python tools/lint_ingest.py
      - run: pytest -q
      - name: Audit Python dependencies
        if: matrix.python == '3.12'
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements-dev.txt --progress-spinner off

  mysql-integration:
    needs: lint-and-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UNIKEGG_PROCESSED_DIR: ./tests/fixtures/processed
      UNIKEGG_DATASET_KIND: synthetic
      MYSQL_PASSWORD: ci-ephemeral-only
      MYSQL_ROOT_PASSWORD: ci-root-ephemeral-only
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Generate independent synthetic data
        run: PYTHONPATH=src python tests/make_fixture.py --edge-cases --legacy-quoting
      - run: docker compose config --quiet
      - run: docker compose up --build -d
      - name: Require successful automatic ingestion
        run: docker compose wait etl
      - name: Verify schema, data and repeat-load behavior
        run: |
          docker compose run --rm etl verify
          docker compose run --rm etl load
      - name: Prepare a separate empty regression database
        run: |
          docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" exec mysql -uroot' <<'SQL'
          CREATE DATABASE UniKeggRegression CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
          GRANT ALL PRIVILEGES ON UniKeggRegression.* TO 'unikegg'@'%';
          SQL
      - name: Real MySQL round-trip, rollback, concurrency and queries
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3307"
          UNIKEGG_MYSQL_TEST_DATABASE: UniKeggRegression
        run: |
          pip install -r requirements.txt
          PYTHONPATH=src python -m tests.mysql_integration
      - name: Surface failed ETL diagnostics in Checks
        if: failure()
        run: |
          docker compose logs --no-color etl > /tmp/unikegg-etl.log 2>&1
          python - <<'PYTHON'
          from pathlib import Path
          message = "\n".join(Path("/tmp/unikegg-etl.log").read_text().splitlines()[-60:])
          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=ETL diagnostics::{message}")
          PYTHON
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Remove ephemeral CI resources
        if: always()
        run: docker compose down --volumes --remove-orphans
